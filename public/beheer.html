<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Memefabriek beheer</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="hazard" aria-hidden="true"></div>
<div class="wrap wide">
  <header class="mast">
    <div class="label">memefabriek.nl &middot; alleen voor beheerders</div>
    <h1>Meme<span>beheer</span></h1>
    <p>Gemelde en verborgen memes. Een meme met 3 meldingen verdwijnt vanzelf van de site tot je hem hier terugzet.</p>
  </header>
  <form class="press" id="login">
    <div class="press-body single">
      <div class="field">
        <label class="label" for="token">Beheersleutel (ADMIN_TOKEN)</label>
        <input type="text" id="token" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="press-actions">
      <button class="btn primary" type="submit">Openen</button>
      <button class="btn" type="button" id="desk">Nieuwsdesk nu laten draaien</button>
      <span class="status" id="status" role="status"></span>
    </div>
  </form>
  <main class="queue" id="queue"></main>
</div>
<script src="/meme.js"></script>
<script src="/beheer.js"></script>
</body>
</html>
